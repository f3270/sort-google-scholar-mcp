[project]
name = "sortgs"
version = "1.0.7"
description = "A Python tool to rank Google Scholar publications by citations."
readme = "README.md"
authors = [{ name = "Fernando Marcos Wittmann" }]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "selenium>=4.39.0",
    "mcp>=1.25.0",
    "openai>=1.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "aiofiles>=25.1.0",
    "tenacity>=9.1.2",
    "chromadb>=1.4.0",
    "sentence-transformers>=5.2.0",
    "pymupdf>=1.26.7",
    "langchain-text-splitters>=1.1.0",
]

[project.urls]
GitHub = "https://github.com/WittmannF/sort-google-scholar"

[project.scripts]
sortgs = "sortgs:main"
sortgs-mcp = "sortgs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "reportlab>=4.4.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["sortgs_mcp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
