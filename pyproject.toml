[project]
name='sortgs'
version='1.0.7'
authors=[{name='Fernando Marcos Wittmann'}]
description='A Python tool to rank Google Scholar publications by citations.'
readme = 'README.md'
urls={github='https://github.com/WittmannF/sort-google-scholar'}
dependencies=[
    # Existing dependencies
    'beautifulsoup4',
    'matplotlib',
    'pandas',
    'requests',
    'selenium',
    # New for MCP
    'mcp>=1.2.0',
    'anthropic',
    'httpx',
    'pydantic>=2.0',
    'pydantic-settings',
    'aiofiles',
    'tenacity',
    # RAG Stack
    'chromadb',
    'sentence-transformers',
    'pymupdf',
    'langchain-text-splitters',
]
scripts = {
    sortgs='sortgs:main',
    'sortgs-mcp'='sortgs_mcp.server:main'
}
classifiers=[
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
]
requires-python='>=3.8'

[build-system]
requires = ['setuptools']
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where =["src"]
